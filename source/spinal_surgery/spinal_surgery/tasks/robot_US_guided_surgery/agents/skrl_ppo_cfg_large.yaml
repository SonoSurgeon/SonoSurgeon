seed: 1


# Models are instantiated using skrl's model instantiator utility
# https://skrl.readthedocs.io/en/latest/api/utils/model_instantiators.html
models:
  separate: false

  policy:
    class: GaussianMixin
    clip_actions: false
    clip_log_std: true
    min_log_std: -20.0
    max_log_std: 2.0
    initial_log_std: 0.0
    network:
    - name: features_extractor
      input: STATES["image"]
      layers:
      - conv2d: {out_channels: 32, kernel_size: 8, stride: 4, padding: 0}
      - conv2d: {out_channels: 64, kernel_size: 4, stride: 2, padding: 0}
      - conv2d: {out_channels: 64, kernel_size: 3, stride: 1, padding: 0}
      - conv2d: {out_channels: 64, kernel_size: 4, stride: 2, padding: 0}
      - flatten
      activations: relu
    - name: net_pos
      input: STATES["pos"]
      layers: [128, 128, 64]
      activations: elu
    - name: net_quat
      input: STATES["quat"]
      layers: [128, 128, 64]
      activations: elu
    - name: net
      input: concatenate([features_extractor, net_pos, net_quat])
      layers: [512, 256, 128]
      activations: elu
    output: ACTIONS

  value:
    class: DeterministicMixin
    clip_actions: false
    network:
    - name: features_extractor
      input: STATES["image"]
      layers:
      - conv2d: {out_channels: 32, kernel_size: 8, stride: 4, padding: 0}
      - conv2d: {out_channels: 64, kernel_size: 4, stride: 2, padding: 0}
      - conv2d: {out_channels: 64, kernel_size: 3, stride: 1, padding: 0}
      - conv2d: {out_channels: 64, kernel_size: 4, stride: 2, padding: 0}
      - flatten
      activations: relu
    - name: net_pos
      input: STATES["pos"]
      layers: [128, 128, 64]
      activations: elu
    - name: net_quat
      input: STATES["quat"]
      layers: [128, 128, 64]
      activations: elu
    - name: net
      input: concatenate([features_extractor, net_pos, net_quat])
      layers: [512, 256, 128]
      activations: elu
    output: ONE


# Rollout memory
# https://skrl.readthedocs.io/en/latest/api/memories/random.html
memory:
  class: RandomMemory
  memory_size: -1  # automatically determined (same as agent:rollouts)


# PPO agent configuration (field names are from PPO_DEFAULT_CONFIG)
# https://skrl.readthedocs.io/en/latest/api/agents/ppo.html
agent:
  class: PPO
  rollouts: 32
  learning_epochs: 4
  mini_batches: 16
  discount_factor: 0.99
  lambda: 0.95
  learning_rate: 5.0e-05
  learning_rate_scheduler: KLAdaptiveLR
  learning_rate_scheduler_kwargs:
    kl_threshold: 0.008
  state_preprocessor:
  state_preprocessor_kwargs:
  value_preprocessor: RunningStandardScaler
  value_preprocessor_kwargs:
  random_timesteps: 0
  learning_starts: 0
  grad_norm_clip: 1.0
  ratio_clip: 0.2
  value_clip: 0.1
  clip_predicted_values: true
  entropy_loss_scale: 0.001
  value_loss_scale: 1.0
  kl_threshold: 0.0
  rewards_shaper_scale: 1.0
  time_limit_bootstrap: false
  # logging and checkpoint
  # logging and checkpoint
  experiment:
    directory: "surgery_large_5seeds"
    experiment_name: "PPO_surgery_large_seed1"
    write_interval: auto
    checkpoint_interval: auto


# Sequential trainer
# https://skrl.readthedocs.io/en/latest/api/trainers/sequential.html
trainer:
  class: SequentialTrainer
  timesteps: 200000 #200000
  environment_info: log
