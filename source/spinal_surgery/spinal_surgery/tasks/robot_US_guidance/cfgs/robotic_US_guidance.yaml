robot:
  type: 'kuka'  # 'kuka', fr3
  pos: [0.0, -0.5, 0.0]
  joint_pos: [1.5, -0.5, 0.0, -1.0, 0.0, 1.6, 0.0]

patient:
  pos: [0.2, -0.2, 0.7]
  euler_yxz: [-90.0, -90.0, 0.0]
  id_list: ['s0010'] #['s0015', 's0024', 's0028', 's0029', 's0030'] # ['s0010'] # 's0010', 's0014', 's0015'
  label_res: 0.0015 # m
  target_anatomy: 'vertebrae_L4'

bed:
  pos: [0.0, 0.0, 0.08]
  euler_xyz: [90, 0.0, 90]
  scale: 0.0004

motion_planning:
  vertebra_to_US_2d_pos: [-28.9, -13.9] # [-30.0, -0.0] [-28.9, -13.9]
  US_target_2d_angle: 1.41 # 1.57 1.41
  US_roll_adj: -0.4
  patient_xz_goal: [150, 170, 3.14]
  use_vertebra_goal: True
  scale: [[5, 5, 0.1]]

observation:
  3D: False
  mode: 'US' # 'seg', 'CT', 'US'
  scale: 0.02 # 0.02 for datacollection, 0.1 for learning-based
  scale_net: 0.1

action:
  mode: 'continuous' # 'discrete', 'continuous'
  scale: [0.5, 0.5, 0.05] # [0.00002, 0.00002, 0.0001] #
  max_action: [1.0, 1.0, 0.1]

reward:
  w_pos: 0.03

sim:
  episode_length: 4
  patient_xz_range: [[85, 100, 1.0], [125, 155, 3.0]]
  patient_xz_init_range: [[90, 110, 1.5], [120, 150, 3.0]]
  if_use_ct: True
  ct_range: [-300, 3000]
  us: 'conv' # 'conv', 'net', 'both'
  vis_us: True
  vis_int: 5
  vis_seg_map: True


if_record_traj: True
record_path: /recordings/robot_US_guidance/